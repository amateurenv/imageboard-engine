name: Quality checks

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://imageboard_app:change-me@localhost:5432/imageboard_test
      REDIS_URL: redis://localhost:6379/0
      TEST_DATABASE_URL: postgresql://imageboard_app:change-me@localhost:5432/imageboard_test
      TEST_REDIS_URL: redis://localhost:6379/15

    services:
      postgresql:
        image: postgres:16
        env:
          POSTGRES_DB: imageboard_test
          POSTGRES_USER: imageboard_app
          POSTGRES_PASSWORD: change-me
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U imageboard_app -d imageboard_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install media dependencies
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg librlottie0-1 util-linux

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Run Ruff
        run: ruff check .

      - name: Run type checks
        run: mypy

      - name: Run tests
        run: pytest
