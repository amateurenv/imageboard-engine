# Этот раздел говорит pip, как собрать проект в устанавливаемый Python-пакет.
[build-system]
# Hatchling — лёгкий инструмент сборки; >= означает «эта или более новая версия».
requires = ["hatchling>=1.27"]
# build-backend — Python-путь к коду Hatchling, который pip вызовет для сборки.
build-backend = "hatchling.build"

# Основные сведения о самом проекте.
[project]
# Техническое имя пакета. Оно не обязано совпадать с именем папки проекта.
name = "imageboard-engine"
# Номер версии. Пока это первая версия каркаса.
version = "0.1.0"
# Короткое описание, которое будет видно инструментам Python.
description = "A configurable imageboard engine built with FastAPI."
# Файл, из которого берётся подробное описание пакета.
readme = "README.md"
# Приложение рассчитано на Python 3.14 и более новые совместимые версии.
requires-python = ">=3.14"
# dependencies — пакеты, нужные самому приложению во время работы.
dependencies = [
    # FastAPI создаёт HTTP API, маршруты и валидацию запросов.
    "fastapi>=0.115",
    # Pydantic Settings читает настройки из переменных окружения и файла .env.
    "pydantic-settings>=2.7",
    # Uvicorn — ASGI-сервер, который принимает запросы браузера и запускает FastAPI.
    "uvicorn[standard]>=0.34",
]

# Необязательные группы зависимостей. Устанавливаются командой pip install -e ".[dev]".
[project.optional-dependencies]
# dev — инструменты только для разработки; на боевом сервере они не обязательны.
dev = [
    # HTTPX позволяет тесту отправлять HTTP-запросы приложению без реального сервера.
    "httpx>=0.28",
    # Pytest находит и запускает автоматические тесты.
    "pytest>=8.3",
    # Ruff быстро ищет ошибки форматирования и частые проблемы в Python-коде.
    "ruff>=0.9",
]

# Настройка Hatchling для сборки wheel-файла — стандартного пакета Python.
[tool.hatch.build.targets.wheel]
# В wheel попадёт Python-пакет из папки app.
packages = ["app"]

# Настройки pytest.
[tool.pytest.ini_options]
# Pytest будет искать тесты только в папке tests.
testpaths = ["tests"]

# Настройки Ruff — линтера, который проверяет качество кода.
[tool.ruff]
# Ruff учитывает синтаксис, доступный в Python 3.14.
target-version = "py314"
# Предпочтительная максимальная длина одной строки кода или комментария.
line-length = 100

# Наборы правил, которые должен применять Ruff.
[tool.ruff.lint]
# E — стиль, F — ошибки Python, I — порядок импортов, UP — современный синтаксис,
# B — распространённые потенциальные ошибки (bugbear).
select = ["E", "F", "I", "UP", "B"]
