# как pip собирает пакет
[build-system]
# hatchling собирает проект, >= значит эта или новая версия
requires = ["hatchling>=1.27"]
# pip вызовет этот модуль для сборки
build-backend = "hatchling.build"

# сведения о проекте
[project]
# имя python пакета
name = "imageboard-engine"
# версия проекта
version = "0.1.0"
# короткое описание
description = "A configurable imageboard engine built with FastAPI."
# подробное описание в README.md
readme = "README.md"
# нужна версия python 3.14 или новее
requires-python = ">=3.14"
# пакеты для работы приложения
dependencies = [
    # fastapi создаёт api и проверяет запросы
    "fastapi>=0.115",
    # pydantic читает настройки из .env
    "pydantic-settings>=2.7",
    # uvicorn запускает fastapi сервер
    "uvicorn[standard]>=0.34",
    # asyncpg подключает приложение к postgresql
    "asyncpg>=0.30",
    # redis для ограничений, очередей и websocket
    "redis>=5.2",
    # bcrypt хеширует пароли сотрудников
    "bcrypt>=4.1",
    # pillow генерирует превью картинок воркером медиа
    "pillow>=10",
    # python-multipart разрешает формы (загрузка файлов)
    "python-multipart>=0.0.9",
]

# дополнительные пакеты для разработки
[project.optional-dependencies]
# dev не нужен на боевом сервере
dev = [
    # httpx отправляет запросы в тестах
    "httpx>=0.28",
    # pytest запускает тесты
    "pytest>=8.3",
    # ruff ищет частые ошибки в коде
    "ruff>=0.9",
    # mypy проверяет типы до запуска приложения
    "mypy>=2.4",
    # pip-tools собирает requirements.lock с точными версиями и хешами
    "pip-tools>=7.7",
]

# настройки hatchling
[tool.hatch.build.targets.wheel]
# в пакет попадёт папка app
packages = ["app"]

# настройки pytest
[tool.pytest.ini_options]
# искать тесты в папке tests
testpaths = ["tests"]
markers = [
    "integration: проверка с настоящими postgresql и redis",
]

# настройки mypy: проверяем код приложения, но не требуем аннотацию у каждой
# локальной переменной - проекту важнее полезные ошибки, чем формальный шум
[tool.mypy]
python_version = "3.14"
files = ["app", "scripts"]
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true

# настройки ruff
[tool.ruff]
# синтаксис python 3.14
target-version = "py314"
# максимальная длина строки
line-length = 100

# наборы правил ruff
[tool.ruff.lint]
# E стиль, F ошибки, I порядок импортов, UP новый синтаксис, B частые ошибки
select = ["E", "F", "I", "UP", "B"]
